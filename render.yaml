# Render Blueprint: PharmaWatch on Render's free plan (New → Blueprint → this repo).
#   pharmawatch-cache  Key Value (Redis-compatible), 25 MB, internal only
#   pharmawatch-api    FastAPI, api/Dockerfile.render (no PyTorch: ~180 MB idle, ~250 MB under load)
#   serpapi-web-static Next.js static export; no instance hours or keep-awake job
# Keys are entered in the Render dashboard (sync: false); they are never in this file or an image.
# Free web services sleep after 15 min idle; the first request after that takes about a minute.
# The browser API URL is fixed at web build time. Cross-service references follow the
# actual URLs Render assigns in each workspace, including a suffix after a name collision.

services:
  - type: keyvalue
    name: pharmawatch-cache
    plan: free
    region: singapore
    ipAllowList: []               # no outside access; the API connects over Render's private network
    maxmemoryPolicy: allkeys-lru  # a full cache drops its oldest entries instead of refusing writes

  - type: web
    name: pharmawatch-api
    runtime: docker
    plan: free
    region: singapore
    dockerContext: .
    dockerfilePath: ./api/Dockerfile.render
    healthCheckPath: /api/health
    envVars:
      - key: REDIS_HOST
        fromService: { type: keyvalue, name: pharmawatch-cache, property: host }
      - key: REDIS_PORT
        fromService: { type: keyvalue, name: pharmawatch-cache, property: port }
      - key: SERP_API_KEY
        sync: false
      - key: SERP_API_KEY_2
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: SERPAPI_ROTATE_KEYS      # key 1 out of searches → key 2
        value: "1"
      - key: DAILY_CREDIT_BUDGET      # SerpApi calls per UTC day; a new medicine costs about 4
        value: "30"
      - key: MAX_CONCURRENT_SEARCHES  # free instances get a fraction of a CPU
        value: "3"
      - key: UI_ORIGINS
        fromService: { type: web, name: serpapi-web-static, envVarKey: RENDER_EXTERNAL_URL }

  - type: web
    name: serpapi-web-static
    runtime: static
    rootDir: web
    buildCommand: npm ci && npm run build
    staticPublishPath: ./out
    envVars:
      - key: NEXT_OUTPUT
        value: export
      - key: SKIP_INSTALL_DEPS
        value: "true"
      - key: NEXT_PUBLIC_API_URL
        fromService: { type: web, name: pharmawatch-api, envVarKey: RENDER_EXTERNAL_URL }
    # Direct links serve their own exported route, including legacy /shop.
    routes:
      - type: rewrite
        source: /engine
        destination: /engine.html
      - type: rewrite
        source: /engine/
        destination: /engine.html
      - type: rewrite
        source: /shop
        destination: /shop.html
      - type: rewrite
        source: /shop/
        destination: /shop.html
